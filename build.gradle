plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
    id 'org.beryx.jlink' version '2.26.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // Java 11+ ok; 17 is a great default
    }
}

javafx {
    version = "21.0.5"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'com.goterl:lazysodium-java:5.1.1'
    implementation 'com.google.protobuf:protobuf-java:4.35.0'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.13'
}

application {
    mainClass = 'com.nodes.chatclient.AppLauncher'
}

jlink {
    launcher {
        name = 'Nodes'
    }
}
